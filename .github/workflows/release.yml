name: CANIS KMS GitHub Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  github-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out selected tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Prepare POSIX owner-mismatch fixtures
        run: sh tools/ci/setup-posix-owner-fixtures.sh

      - name: Require matching release tag and clean checkout
        shell: bash
        run: |
          set -euo pipefail
          version="$(python3 -c 'import xml.etree.ElementTree as ET; root = ET.parse("pom.xml").getroot(); ns = {"m": "http://maven.apache.org/POM/4.0.0"}; print(root.find("m:version", ns).text)')"
          expected="refs/tags/v${version}"
          if [[ "${GITHUB_REF}" != "${expected}" ]]; then
            echo "Select the existing tag ${expected} when dispatching this workflow." >&2
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "$(git rev-list -n 1 "${GITHUB_REF}")"
          test -z "$(git status --porcelain)"
          echo "RELEASE_VERSION=${version}" >> "${GITHUB_ENV}"

      - name: Verify tagged source
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Require Issue 1 POSIX security cases to execute
        run: java tools/ci/VerifyIssue1PosixCoverage.java server/target/surefire-reports/TEST-io.canis.crypto.MasterKeyLoaderTest.xml

      - name: Require Issue 2 POSIX database cases to execute
        run: java tools/ci/VerifyIssue2PosixCoverage.java server/target/surefire-reports/TEST-io.canis.store.DatabaseReplacementTest.xml

      - name: Generate tracked source archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/release
          git archive --format=zip --prefix="canis-kms-${RELEASE_VERSION}/" --output="target/release/canis-kms-${RELEASE_VERSION}-src.zip" HEAD
          unzip -t "target/release/canis-kms-${RELEASE_VERSION}-src.zip" > /dev/null

      - name: Ensure local master branch exists
        run: git branch -f master HEAD

      - name: Verify JReleaser configuration
        env:
          JRELEASER_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mvn --batch-mode --no-transfer-progress -N jreleaser:config

      - name: Create GitHub Release
        env:
          JRELEASER_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          mvn --batch-mode --no-transfer-progress -N jreleaser:full-release
          -Djreleaser.deploy.skip=true
          -Djreleaser.upload.skip=true
          -Djreleaser.publish.skip=true

      - name: Retain local JReleaser results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jreleaser-results
          path: |
            target/jreleaser/release/CHANGELOG.md
            target/jreleaser/checksums/checksums*.txt
            target/release/canis-kms-*-src.zip
          if-no-files-found: ignore
          retention-days: 7
