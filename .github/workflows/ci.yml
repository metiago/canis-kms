name: CANIS KMS CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and Test (Java 21)
    runs-on: ubuntu-latest

    timeout-minutes: 15

    env:
      CANIS_PORT: "3307"
      CANIS_SERVER_HOST: "localhost"
      CANIS_SERVER_PORT: "3307"
      CANIS_USERNAME: "ci-admin"
      CANIS_PASSWORD: "ci-test-password"
      CANIS_SECRET_KEY: "/tmp/canis-secret.txt"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Create test secret file
        run: |
          printf '%s\n' \
            'ci-only-test-secret' > "$CANIS_SECRET_KEY"
          chmod 600 "$CANIS_SECRET_KEY"

      - name: Build and run tests
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            server/target/surefire-reports/
            client/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload server JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: canis-server
          path: server/target/*jar-with-dependencies.jar
          if-no-files-found: error
          retention-days: 7
